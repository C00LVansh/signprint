[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/C00LVansh/signprint"
rust-version = "1.85"

[workspace.dependencies]
base64 = "0.23"
chacha20poly1305 = "0.11"
hkdf = "0.13"
hmac = "0.13"
p256 = { version = "0.14", features = ["ecdh"] }
rand_core = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sfv = "0.16"
sha2 = "0.11"
subtle = "2.6"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
