[package]
name = "signprint-demo"
description = "A small app to put behind signprint: a login form, a product catalogue to try to scrape, and a scoreboard"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
signprint-core = { path = "../signprint-core" }
signprint-wire = { path = "../signprint-wire" }
axum = "0.8"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "fs"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
